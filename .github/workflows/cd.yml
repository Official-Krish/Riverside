name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-manifests:
    name: Update Kubernetes Manifests

    runs-on: ubuntu-latest

    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Changed Services
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: changed-services
          path: changed

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Update Image Tags
        shell: bash
        run: |
          VERSION=v1.2.${{ github.event.workflow_run.run_number }}

          if [ "$(cat changed/backend)" = "true" ]; then
            sed -i "s|image: krishanand01/weave-backend:.*|image: krishanand01/weave-backend:$VERSION|g" ops/deployment.yml
          fi

          if [ "$(cat changed/frontend)" = "true" ]; then
            sed -i "s|image: krishanand01/weave-frontend:.*|image: krishanand01/weave-frontend:$VERSION|g" ops/deployment.yml
          fi

          if [ "$(cat changed/ws_relayer)" = "true" ]; then
            sed -i "s|image: krishanand01/weave-ws-relayer:.*|image: krishanand01/weave-ws-relayer:$VERSION|g" ops/deployment.yml
          fi

          if [ "$(cat changed/merger_worker)" = "true" ]; then
            sed -i "s|image: krishanand01/weave-merger-worker:.*|image: krishanand01/weave-merger-worker:$VERSION|g" ops/deployment.yml
          fi

          if [ "$(cat changed/editor_worker)" = "true" ]; then
            sed -i "s|image: krishanand01/weave-editor-worker:.*|image: krishanand01/weave-editor-worker:$VERSION|g" ops/deployment.yml
          fi

          if [ "$(cat changed/transcoder)" = "true" ]; then
            sed -i "s|image: krishanand01/weave-transcoder:.*|image: krishanand01/weave-transcoder:$VERSION|g" ops/deployment.yml
          fi

      - name: Commit Changes
        run: |
          git add ops/deployment.yml

          git commit -m "chore: update image tags to v1.2.${{ github.event.workflow_run.run_number }}" || echo "No changes"

      - name: Push Changes
        run: |
          git push origin main
