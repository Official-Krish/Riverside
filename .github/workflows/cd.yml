name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-manifests:
    name: Update Kubernetes Manifests

    runs-on: ubuntu-latest

    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Update Image Tags
        run: |
          VERSION=v1.${{ github.event.workflow_run.run_number }}

          sed -i "s|image: krishanand01/weave-frontend:.*|image: krishanand01/weave-frontend:$VERSION|g" ops/deployment.yml

          sed -i "s|image: krishanand01/weave-backend:.*|image: krishanand01/weave-backend:$VERSION|g" ops/deployment.yml

          sed -i "s|image: krishanand01/weave-ws-relayer:.*|image: krishanand01/weave-ws-relayer:$VERSION|g" ops/deployment.yml

          sed -i "s|image: krishanand01/weave-merger-worker:.*|image: krishanand01/weave-merger-worker:$VERSION|g" ops/deployment.yml

          sed -i "s|image: krishanand01/weave-editor-worker:.*|image: krishanand01/weave-editor-worker:$VERSION|g" ops/deployment.yml

          sed -i "s|image: krishanand01/weave-transcoder:.*|image: krishanand01/weave-transcoder:$VERSION|g" ops/deployment.yml

      - name: Commit Changes
        run: |
          git add ops/deployment.yml

          git commit -m "chore: update image tags to v1.${{ github.event.workflow_run.run_number }} [skip ci]" || echo "No changes"

      - name: Push Changes
        run: |
          git push origin main