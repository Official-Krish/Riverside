apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: weave-frontend-cert
  namespace: weave
spec:
  secretName: weave-frontend-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: weave.krishlabs.tech
  dnsNames:
  - weave.krishlabs.tech
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: weave-backend-cert
  namespace: weave
spec:
  secretName: weave-backend-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: api.weave.krishlabs.tech
  dnsNames:
  - api.weave.krishlabs.tech
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: weave-ws-relayer-cert
  namespace: weave
spec:
  secretName: weave-ws-relayer-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: wss.weave.krishlabs.tech
  dnsNames:
  - wss.weave.krishlabs.tech