apiVersion: apps/v1
kind: Deployment
metadata:
  name: weave-frontend
  namespace: weave
  labels:
    app: weave-frontend
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: weave-frontend
  template:
    metadata:
      labels:
        app: weave-frontend
    spec:
      containers:
        - name: weave-frontend
          image: krishanand01/weave-frontend:v1.2.22
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: env-file
              mountPath: /app/apps/frontend/.env
              subPath: env

      volumes:
        - name: env-file
          secret:
            secretName: weave-frontend-env

