---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weave

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Always

          ports:
            - containerPort: 6379

          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          emptyDir: {}
