---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weave-merger-worker
  namespace: weave
  labels:
    app: weave-merger-worker

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: weave-merger-worker

  template:
    metadata:
      labels:
        app: weave-merger-worker

    spec:
      restartPolicy: Always

      containers:
        - name: weave-merger-worker
          image: krishanand01/weave-merger-worker:v1.2.22
          imagePullPolicy: Always

          resources:
            limits:
              cpu: "512m"
              memory: "1Gi"

          volumeMounts:
            - name: env-file
              mountPath: /app/apps/merger-worker/.env
              subPath: env

            - name: merger-worker-storage
              mountPath: /app/recordings

      volumes:
        - name: env-file
          secret:
            secretName: weave-merger-worker-env

        - name: merger-worker-storage
          emptyDir:
            sizeLimit: 20Gi

